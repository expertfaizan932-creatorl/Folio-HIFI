<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e11d2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Folio"><link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/icon-192.png"><script defer src="/js/pwa.js"></script><style>
    body { background: linear-gradient(135deg, #7030f0 0%, #e11d2e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { max-width: 420px; width: 100%; border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .logo { background: linear-gradient(135deg, #7030f0, #e11d2e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
</style>
</head>
<body>
<div class="container">
  <div class="card login-card mx-auto">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <img src="/icons/icon-192.png?v=20261001" alt="Folio" class="img-fluid mb-2" style="width: 96px; height: 96px; object-fit: contain; border-radius: 50%;">
        <h1 class="h3 fw-bold logo mb-1">Folio</h1>
        <p class="text-muted mb-0">Employee Monitoring &amp; Reports</p>
      </div>
                  <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="username" class="form-control" placeholder="you@workfolio.com" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" style="background:linear-gradient(135deg,#7030f0,#e11d2e);border:0">Sign in</button>
      </form>
          </div>
  </div>
</div>
</body>
</html>
