server.port=${SERVER_PORT:8080}

# Never leak exception messages to the browser. The "prod" profile repeats this
# with a louder comment; keeping it here means a stray profile cannot re-expose it.
server.error.include-message=never
server.error.include-stacktrace=never

# ---------------------------------------------------------------------------
# Database - DEFAULT PROFILE = H2
# ---------------------------------------------------------------------------
# This profile is the zero-setup developer experience:
#   .\mvnw.cmd spring-boot:run      -> file-backed H2, no install required
#
# For MySQL (XAMPP locally, or MySQL 8 on a server) run with the profile:
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# and see application-mysql.properties.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/db/workfolio;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Thymeleaf - enable caching in the "prod" profile; stale templates during
# development are more annoying than a restart.
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------------
# WorkFolio monitoring
# ---------------------------------------------------------------------------
# Root folder for screenshots captured by the desktop agent.
# Must be a MOUNTED VOLUME in a container or every deploy loses the captures.
workfolio.storage.root=${WORKFOLIO_STORAGE:./data}
# Days of screenshots to keep when an admin runs "purge old captures".
workfolio.storage.retention-days=${WORKFOLIO_RETENTION_DAYS:30}
# Max upload size for a single agent screenshot (2 MB of JPEG).
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=8MB

# ---------------------------------------------------------------------------
# Web surface
# ---------------------------------------------------------------------------
# Everything is served through a TLS-terminating reverse proxy (Caddy / Nginx),
# so the app itself must only ever be reachable over plain HTTP on localhost.
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
# Demo
# ---------------------------------------------------------------------------
# Shows the seeded sign-in credentials on the login screen. Keep this false on a
# real deployment so the admin/HR/employee passwords are not shown to everyone
# who opens the page. Set it to true only for demonstrations.
workfolio.demo.show-accounts=false
