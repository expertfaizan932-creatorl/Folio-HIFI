# ---------------------------------------------------------------------------
# MySQL profile
# ---------------------------------------------------------------------------
# Activate with:
#   local (XAMPP):  $env:SPRING_PROFILES_ACTIVE = 'mysql'
#   server:         SPRING_PROFILES_ACTIVE=mysql
#
# The schema is created and kept up to date by Hibernate (ddl-auto=update), so
# the database only needs to exist and be empty:
#
#   CREATE DATABASE workfolio CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#   CREATE USER 'workfolio'@'%' IDENTIFIED BY 'a-strong-password';
#   GRANT ALL PRIVILEGES ON workfolio.* TO 'workfolio'@'%';
#   FLUSH PRIVILEGES;
#
# Everything below is environment driven, so the same jar runs against a local
# XAMPP instance and a production MySQL 8 server with no rebuild.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:workfolio}?${DB_PARAMS:useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&rewriteBatchedStatements=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:workfolio}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# REQUIRED, not cosmetic. The employees table has a column called `role`, which
# is a reserved word in MySQL 8. Hibernate 5.6's keyword list predates that, so
# without global quoting the generated DDL fails with a syntax error. Backticks
# are valid in MySQL, and this profile only ever talks to MySQL.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# The table charset comes from the database and server defaults (utf8mb4), set in
# the CREATE DATABASE statement above and by --character-set-server in
# docker-compose.yml. The characterEncoding in the JDBC URL below only fixes the
# client/connection charset, which is not the same thing.
# utf8mb4 matters here because indexed VARCHAR columns are measured in bytes:
# 255 characters of utf8mb4 is 1020 bytes, and InnoDB caps an index key at 3072
# bytes, so utf8 (3 bytes) would overflow on a wide index.

# H2 console must never be reachable when the real database is in use.
spring.h2.console.enabled=false
