# ---------------------------------------------------------------------------
# Production hardening
# ---------------------------------------------------------------------------
# Run as:  SPRING_PROFILES_ACTIVE=mysql,prod
# Always pair this with the mysql profile - prod only tightens the app, it does
# not choose a database.
#
# TLS is terminated by the reverse proxy (Caddy/Nginx) in front of this app, so
# these settings are about how the app reacts to the proxy, not about serving
# certificates itself.
# ---------------------------------------------------------------------------

# Trust X-Forwarded-Proto / X-Forwarded-For so Spring Security issues `Secure`
# cookies and the activity log records the real client IP, not the proxy's.
server.forward-headers-strategy=framework

# Templates change only on deploy, so cache them.
spring.thymeleaf.cache=true

# Screenshot pages render large galleries; keep responses compressed.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/plain,text/xml
server.compression.min-response-size=2048

# Session cookies: Secure (TLS only), HttpOnly (not readable by scripts),
# SameSite=Lax (the agent posts to /api/**, which is CSRF-exempt, so this does
# not interfere with monitoring traffic).
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Do not advertise the framework.
server.servlet.session.tracking-modes=cookie
server.error.whitelabel.enabled=false

# Longer sessions, fewer re-logins during a shift.
server.servlet.session.timeout=12h

# ---------------------------------------------------------------------------
# Data protection
# ---------------------------------------------------------------------------
# Screenshots are the most sensitive thing this system stores. Keep the
# retention window short; the admin can also purge manually from Agent Settings.
workfolio.storage.retention-days=${WORKFOLIO_RETENTION_DAYS:14}

# Never show seeded credentials on a real deployment.
workfolio.demo.show-accounts=false
