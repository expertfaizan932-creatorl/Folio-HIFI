<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folio - Activity Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .sidebar { min-height: 100vh; background: #1e2248; }
        .sidebar .nav-link { color: #b8bcd6; border-radius: 8px; margin: 2px 0; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #667eea; color: #fff; }
        .logo { font-weight: 800; }
        .card { border: none; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
        .act-login { background:#e0e7ff; color:#4338ca; }
        .act-page { background:#dcfce7; color:#166534; }
        .act-create { background:#fee2e2; color:#b91c1c; }
        .act-update { background:#fef3c7; color:#92400e; }
        .act-delete { background:#f3e8ff; color:#7e22ce; }
        .act-logout { background:#f1f5f9; color:#334155; }
        .mono { font-family: Consolas, monospace; font-size: .85rem; }
    </style>
    <th:block th:insert="~{fragments/pwa :: pwaHead}"></th:block>
</head>
<body>
<div class="d-flex">
    <div class="sidebar p-3 text-white" style="width: 250px;">
        <h4 class="logo mb-4 px-2">Folio</h4>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/employees}"><i class="bi bi-people me-2"></i>Employees</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/reports}"><i class="bi bi-bar-chart me-2"></i>Reports</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/usage}"><i class="bi bi-graph-up-arrow me-2"></i>Activity Report</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/agent-config}"><i class="bi bi-sliders me-2"></i>Agent Settings</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/admin/activity}"><i class="bi bi-eye-fill me-2"></i>Activity Tracker</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/profile}"><i class="bi bi-person-circle me-2"></i>My Profile</a></li>
            <li class="nav-item mt-4">
                <form th:action="@{/logout}" method="post">
                    <button class="nav-link w-100 text-start border-0 bg-transparent" style="color:#ff9c9c;"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                </form>
            </li>
        </ul>
    </div>
    <div class="flex-grow-1">
        <nav class="navbar navbar-light bg-white shadow-sm px-4">
            <span class="navbar-brand fw-semibold">Activity Tracker <span class="badge text-bg-danger" th:text="${totalLogs}">0</span></span>
            <span class="badge text-bg-warning"><i class="bi bi-shield-exclamation me-1"></i>Admin Only - Deep Monitoring</span>
        </nav>
        <div class="p-4">
            <div class="card p-3 mb-3">
                <form method="get" th:action="@{/admin/activity}" class="row g-2 align-items-end">
                    <div class="col-auto">
                        <label class="form-label small mb-1">Filter by Role</label>
                        <select name="role" class="form-select form-select-sm">
                            <option value="">All Roles</option>
                            <option value="ADMIN" th:selected="${role == 'ADMIN'}">Admin</option>
                            <option value="HR" th:selected="${role == 'HR'}">HR</option>
                            <option value="EMPLOYEE" th:selected="${role == 'EMPLOYEE'}">Employee</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label small mb-1">Filter by User</label>
                        <select name="email" class="form-select form-select-sm" style="min-width: 220px;">
                            <option value="">All Users</option>
                            <option th:each="em : ${emails}" th:value="${em}" th:text="${em}" th:selected="${em == email}"></option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary btn-sm px-4"><i class="bi bi-funnel me-1"></i>Apply Filter</button>
                        <a th:href="@{/admin/activity}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg me-1"></i>Clear</a>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive" style="max-height: 560px; overflow-y: auto;">
                        <table class="table table-hover align-middle table-sm mb-0">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th>#</th><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Details</th><th>IP</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log, i : ${logs}">
                                    <td class="text-muted mono" th:text="${i.index + 1}">1</td>
                                    <td class="mono" th:text="${log.friendlyTime}">time</td>
                                    <td>
                                        <strong th:text="${log.userName}">Name</strong><br>
                                        <span class="text-muted small" th:text="${log.userEmail}">email</span>
                                    </td>
                                    <td>
                                        <span class="badge rounded-pill"
                                              th:classappend="${log.userRole == 'ADMIN'} ? 'act-login' : (${log.userRole == 'HR'} ? 'act-update' : 'act-page')"
                                              th:text="${log.userRole}">ROLE</span>
                                    </td>
                                    <td>
                                        <span class="badge rounded-pill"
                                              th:classappend="${log.action == 'LOGIN'} ? 'act-login' : (${log.action == 'PAGE_VIEW'} ? 'act-page' : (${log.action == 'CREATE_EMPLOYEE'} ? 'act-create' : (${log.action == 'UPDATE_EMPLOYEE'} ? 'act-update' : (${log.action == 'DELETE_EMPLOYEE'} ? 'act-delete' : 'act-logout'))))"
                                              th:text="${log.action}">ACTION</span>
                                    </td>
                                    <td th:text="${log.details}">details</td>
                                    <td class="mono text-muted" th:text="${log.ipAddress}">ip</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:insert="~{fragments/pwa :: pwaInstall}"></th:block>
</body>
</html>
