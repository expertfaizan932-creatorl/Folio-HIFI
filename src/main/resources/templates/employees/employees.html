<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folio - Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .sidebar { min-height: 100vh; background: #1e2248; }
        .sidebar .nav-link { color: #b8bcd6; border-radius: 8px; margin: 2px 0; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #667eea; color: #fff; }
        .logo { font-weight: 800; }
        .badge-role-admin { background:#fee2e2; color:#b91c1c; }
        .badge-role-hr { background:#e0e7ff; color:#4338ca; }
        .badge-role-employee { background:#dcfce7; color:#166534; }
    </style>
    <th:block th:insert="~{fragments/pwa :: pwaHead}"></th:block>
</head>
<body>
<div class="d-flex">
    <div class="sidebar p-3 text-white" style="width: 250px;">
        <h4 class="logo mb-4 px-2">Folio</h4>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/employees}"><i class="bi bi-people me-2"></i>Employees</a></li>
            <li class="nav-item" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}"><a class="nav-link" th:href="@{/admin/reports}"><i class="bi bi-bar-chart me-2"></i>Reports</a></li>
            <li class="nav-item" th:if="${currentUser != null and (currentUser.role.name() == 'ADMIN' || currentUser.role.name() == 'HR')}"><a class="nav-link" th:href="@{/admin/usage}"><i class="bi bi-graph-up-arrow me-2"></i>Activity Report</a></li>
            <li class="nav-item" th:if="${currentUser != null and (currentUser.role.name() == 'ADMIN' || currentUser.role.name() == 'HR')}"><a class="nav-link" th:href="@{/admin/agent-config}"><i class="bi bi-sliders me-2"></i>Agent Settings</a></li>
            <li class="nav-item" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}"><a class="nav-link" th:href="@{/admin/activity}"><i class="bi bi-eye-fill me-2"></i>Activity Tracker</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/profile}"><i class="bi bi-person-circle me-2"></i>My Profile</a></li>
            <li class="nav-item mt-4">
                <form th:action="@{/logout}" method="post">
                    <button class="nav-link w-100 text-start border-0 bg-transparent" style="color:#ff9c9c;"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                </form>
            </li>
        </ul>
    </div>
    <div class="flex-grow-1">
        <nav class="navbar navbar-light bg-white shadow-sm px-4">
            <span class="navbar-brand fw-semibold">Employee Directory <span class="badge text-bg-secondary" th:text="${totalCount}">0</span></span>
            <a th:href="@{/employees/new}" class="btn btn-primary btn-sm"><i class="bi bi-person-plus me-1"></i>Add Employee</a>
        </nav>
        <div class="p-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Designation</th><th>Role</th><th>Salary</th><th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="emp : ${employees}">
                                    <td th:text="${emp.id}">1</td>
                                    <td><strong th:text="${emp.fullName}">Name</strong></td>
                                    <td th:text="${emp.email}">email</td>
                                    <td th:text="${emp.department}">Dept</td>
                                    <td th:text="${emp.designation}">Designation</td>
                                    <td><span class="badge rounded-pill" th:classappend="${emp.role.name() == 'ADMIN'} ? 'badge-role-admin' : (${emp.role.name() == 'HR'} ? 'badge-role-hr' : 'badge-role-employee')" th:text="${emp.role}">ROLE</span></td>
                                    <td th:text="${emp.salary}">0.00</td>
                                    <td>
                                        <a th:href="@{'/admin/employees/edit/' + ${emp.id}}" class="btn btn-sm btn-outline-primary" title="Edit"><i class="bi bi-pencil"></i></a>
                                        <a th:href="@{'/admin/employees/delete/' + ${emp.id}}" class="btn btn-sm btn-outline-danger" title="Delete"
                                           th:attr="data-confirm=${'Delete ' + emp.firstName + ' permanently?'}"
                                           onclick="return confirmDelete(this)"><i class="bi bi-trash"></i></a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Thymeleaf 3 forbids variable expressions inside event-handler attributes, so the
    // confirmation text is carried on a data-* attribute and read from here.
    function confirmDelete(el) {
        return window.confirm(el.getAttribute('data-confirm') || 'Delete this employee?');
    }
</script>
</body>
</html>
