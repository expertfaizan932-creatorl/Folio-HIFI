<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folio - My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .card { border: none; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #fff; }
    </style>
    <th:block th:insert="~{fragments/pwa :: pwaHead}"></th:block>
</head>
<body>
<div class="container py-5" style="max-width: 680px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0"><i class="bi bi-person-circle me-2"></i>My Profile</h4>
        <a th:href="@{/dashboard}" class="btn btn-light border"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
    </div>
    <div class="card p-4">
        <div class="d-flex align-items-center mb-4">
            <div class="avatar me-3"><i class="bi bi-person-fill"></i></div>
            <div>
                <h5 class="mb-0" th:text="${currentUser.fullName}">Name</h5>
                <span class="badge rounded-pill text-bg-primary mt-1" th:text="${'Role: ' + currentUser.role}">Role</span>
            </div>
        </div>
        <table class="table">
            <tr><td class="fw-semibold text-muted w-25">Email</td><td th:text="${currentUser.email}">email</td></tr>
            <tr><td class="fw-semibold text-muted">Phone</td><td th:text="${currentUser.phone}">phone</td></tr>
            <tr><td class="fw-semibold text-muted">Department</td><td th:text="${currentUser.department}">dept</td></tr>
            <tr><td class="fw-semibold text-muted">Designation</td><td th:text="${currentUser.designation}">desig</td></tr>
            <tr><td class="fw-semibold text-muted">Salary</td><td th:text="'₹ ' + ${currentUser.salary}">salary</td></tr>
            <tr><td class="fw-semibold text-muted">Join Date</td><td th:text="${currentUser.joinDate}">date</td></tr>
            <tr><td class="fw-semibold text-muted">Address</td><td th:text="${currentUser.address}">addr</td></tr>
        </table>
    </div>
</div>
</body>
</html>
