<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folio - Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .sidebar { min-height: 100vh; background: #1e2248; }
        .sidebar .nav-link { color: #b8bcd6; border-radius: 8px; margin: 2px 0; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #667eea; color: #fff; }
        .logo { font-weight: 800; }
        .stat-card { border: none; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    </style>
    <th:block th:insert="~{fragments/pwa :: pwaHead}"></th:block>
</head>
<body>
<div class="d-flex">
    <div class="sidebar p-3 text-white" style="width: 250px;">
        <h4 class="logo mb-4 px-2">Folio</h4>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/employees}"><i class="bi bi-people me-2"></i>Employees</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/admin/reports}"><i class="bi bi-bar-chart me-2"></i>Reports</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/usage}"><i class="bi bi-graph-up-arrow me-2"></i>Activity Report</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/agent-config}"><i class="bi bi-sliders me-2"></i>Agent Settings</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/activity}"><i class="bi bi-eye-fill me-2"></i>Activity Tracker</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/profile}"><i class="bi bi-person-circle me-2"></i>My Profile</a></li>
            <li class="nav-item mt-4">
                <form th:action="@{/logout}" method="post">
                    <button class="nav-link w-100 text-start border-0 bg-transparent" style="color:#ff9c9c;"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                </form>
            </li>
        </ul>
    </div>
    <div class="flex-grow-1">
        <nav class="navbar navbar-light bg-white shadow-sm px-4">
            <span class="navbar-brand fw-semibold">Reports &amp; Analytics</span>
        </nav>
        <div class="p-4">
            <div class="row g-3 mb-4">
                <div class="col-md-3 col-sm-6">
                    <div class="card stat-card p-3"><div class="text-muted small">Total Employees</div><div class="fs-3 fw-bold" th:text="${totalEmployees}">0</div></div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="card stat-card p-3"><div class="text-muted small">Admins</div><div class="fs-3 fw-bold" th:text="${totalAdmins}">0</div></div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="card stat-card p-3"><div class="text-muted small">HR Team</div><div class="fs-3 fw-bold" th:text="${totalHR}">0</div></div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="card stat-card p-3"><div class="text-muted small">Staff</div><div class="fs-3 fw-bold" th:text="${totalStaff}">0</div></div>
                </div>
            </div>
            <div class="card stat-card p-4">
                <div class="text-muted small mb-1">Average Salary Across Company</div>
                <div class="fs-1 fw-bold text-primary" th:text="'₹ ' + ${avgSalary}">0</div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
